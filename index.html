<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt bàn | Mạn Kitchen & Bar</title>
<meta name="description" content="Đặt bàn online tại Mạn Open Kitchen & Bar, 104E Hàm Nghi, Q.1">
<style>
html,body{margin:0;height:100%}
body{background:#27214D;color:#FED1A5;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box}
a{color:#F15636;font-weight:700}
</style>
</head>
<body>
<p id="m">Đang mở trang đặt bàn của Mạn...<br><small>Opening Mạn booking page...</small></p>
<script>
/* Trang đặt bàn Mạn trên GitHub Pages.
 * Giao diện và xử lý nằm ở Google Apps Script (dự án Man Booking Online); trang này chỉ tải giao diện về hiển thị,
 * để khách mở được từ trình duyệt trong Instagram, Facebook, TikTok. Sửa giao diện thì sửa Index.html trong Apps Script. */
var API = 'https://script.google.com/macros/s/AKfycbyqiWG9j3vmd6Nek5OEOEzgICFIbhvSxtd0uP6nQL_4FooPgHm97keT4NkxWA0mWOTRGg/exec';
var q = new URLSearchParams(location.search);
var u = API + '?api=page&web=' + encodeURIComponent(location.origin + location.pathname.replace(/index\.html$/, '').replace(/\/$/, ''));
if (q.get('huy')) u += '&huy=' + encodeURIComponent(q.get('huy'));
if (q.get('ngay')) u += '&ngay=' + encodeURIComponent(q.get('ngay'));
function loi() {
  document.getElementById('m').innerHTML = 'Chưa tải được trang đặt bàn. Bạn tải lại trang, hoặc gọi/nhắn Zalo <a href="tel:0993061525">0993 061 525</a> để Mạn giữ bàn nhé.<br><br><small>Could not load the booking page. Please reload, or call/Zalo <a href="tel:0993061525">0993 061 525</a>.</small>';
}
fetch(u).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (h) {
  if (h.indexOf('<html') < 0) throw 0;
  document.open(); document.write(h); document.close();
}).catch(loi);
</script>
</body>
</html>
